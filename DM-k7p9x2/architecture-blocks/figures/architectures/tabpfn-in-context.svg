<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">TabPFN in-context classifier</title><desc id="d">Labeled and query rows enter a prior-fitted Transformer and class head.</desc><style>.bg{fill:var(--diagram-bg,#fff)}.n{stroke:var(--diagram-edge,#47647f);stroke-width:2}.a{fill:var(--diagram-input,#e8eef5)}.b{fill:var(--diagram-processing,#eee8ff)}.c{fill:var(--diagram-decision,#dff5ef)}.tx{fill:var(--diagram-text,#1b2b43);font:600 18px system-ui;text-anchor:middle}.e{stroke:var(--diagram-edge,#47647f);stroke-width:3}</style><rect class="bg" width="960" height="300"/><g id="node-input"><rect class="n a" x="30" y="88" width="260" height="124" rx="14"/><text class="tx" x="160" y="143">Labeled context rows</text><text class="tx" x="160" y="170">+ query rows</text></g><path class="e" d="M290 150H365"/><g id="node-backbone"><rect class="n b" x="365" y="88" width="260" height="124" rx="14"/><text class="tx" x="495" y="143">Prior-data fitted</text><text class="tx" x="495" y="170">Transformer</text></g><path class="e" d="M625 150H700"/><g id="node-head"><rect class="n c" x="700" y="88" width="230" height="124" rx="14"/><text class="tx" x="815" y="143">Query-row class</text><text class="tx" x="815" y="170">probabilities</text></g></svg>
