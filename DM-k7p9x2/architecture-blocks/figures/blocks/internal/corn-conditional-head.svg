<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d"><title id="t">CORN conditional head internals</title><desc id="d">Conditional tasks use progressively filtered training sets and chained probabilities.</desc><style>.b{fill:var(--diagram-bg,#fff)}.n{stroke:var(--diagram-edge,#47647f);stroke-width:2}.i{fill:var(--diagram-input,#e5f5ec)}.h{fill:var(--diagram-decision,#fbe4e8)}.o{fill:var(--diagram-output,#f7eacb)}.x{fill:var(--diagram-text,#1b2b43);font:600 14px system-ui;text-anchor:middle}.e{stroke:var(--diagram-edge,#47647f);stroke-width:3}</style><rect class="b" width="800" height="360"/><rect class="n i" x="25" y="115" width="145" height="130" rx="12"/><text class="x" x="97" y="175">Feature x</text><text class="x" x="97" y="200">ordered label y</text><path class="e" d="M170 180H220"/><rect class="n h" x="220" y="35" width="235" height="290" rx="12"/><text class="x" x="337" y="85">Task 0: all examples</text><text class="x" x="337" y="115">P(y&gt;0)</text><text class="x" x="337" y="170">Task 1: only y&gt;0</text><text class="x" x="337" y="200">P(y&gt;1 | y&gt;0)</text><text class="x" x="337" y="255">Task k: only y&gt;k−1</text><text class="x" x="337" y="285">conditional BCE logits</text><path class="e" d="M455 180H505"/><rect class="n o" x="505" y="80" width="270" height="200" rx="12"/><text class="x" x="640" y="130">sigmoid conditional probabilities</text><text class="x" x="640" y="170">p₀, p₁, …, pK−2</text><text class="x" x="640" y="210">ordered chain accumulation</text><text class="x" x="640" y="245">→ ordinal class</text></svg>
