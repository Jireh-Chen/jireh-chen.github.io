<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">BART-MNLI zero-shot classification</title><desc id="d">Candidate hypotheses flow through BART-MNLI to an entailment head.</desc><style>.bg{fill:var(--diagram-bg,#fff)}.n{stroke:var(--diagram-edge,#47647f);stroke-width:2}.a{fill:var(--diagram-input,#e8eef5)}.b{fill:var(--diagram-processing,#eee8ff)}.c{fill:var(--diagram-decision,#dff5ef)}.tx{fill:var(--diagram-text,#1b2b43);font:600 18px system-ui;text-anchor:middle}.e{stroke:var(--diagram-edge,#47647f);stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="var(--diagram-edge,#47647f)"/></marker></defs><rect class="bg" width="960" height="300"/><g id="node-input"><rect class="n a" x="30" y="88" width="260" height="124" rx="14"/><text class="tx" x="160" y="143">Input + label hypotheses</text><text class="tx" x="160" y="170">one pair per candidate</text></g><path class="e" d="M290 150H365"/><g id="node-backbone"><rect class="n b" x="365" y="88" width="260" height="124" rx="14"/><text class="tx" x="495" y="155">BART-large MNLI</text></g><path class="e" d="M625 150H700"/><g id="node-head"><rect class="n c" x="700" y="88" width="230" height="124" rx="14"/><text class="tx" x="815" y="143">Entailment head</text><text class="tx" x="815" y="170">candidate scores</text></g></svg>
