<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Complete publication list">
  <title>Publications</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Old+Standard+TT:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Reuse the homepage newspaper theme -->
  <link rel="stylesheet" href="style.css">
  <!-- Publications-page-specific layout -->
  <link rel="stylesheet" href="publications-page.css">
</head>
<body>
  <a class="skip-link" href="#publicationArchive">Skip to publications</a>

  <main class="broadsheet publications-broadsheet">
    <header class="publications-header">
      <div class="publications-topline">
        <a class="back-home" href="index.html">&larr; HOME</a>
        <span class="archive-label">RESEARCH ARCHIVE</span>
      </div>

      <div class="publications-title-rule"></div>
      <h1 class="publications-title">PUBLICATIONS</h1>
      <div class="publications-title-rule publications-title-rule-thin"></div>

      <div class="publications-intro">
        <p id="publicationsIntro">Complete list of publications, grouped by year.</p>
        <p class="publication-legend">
          <span class="legend-self">Highlighted name</span> = myself
          <span class="legend-separator">&middot;</span>
          <sup>*</sup> Corresponding author
        </p>
      </div>
    </header>

    <section id="publicationArchive" class="publication-archive" aria-live="polite"></section>

    <footer class="publication-page-footer">
      <div class="publication-footer-rule"></div>
      <a href="index.html" class="back-home back-home-bottom">&larr; BACK TO HOME</a>
    </footer>
  </main>

  <!-- Keep all publication data in config.js -->
  <script src="config.js"></script>
  <script src="publications-page.js"></script>
</body>
</html>
