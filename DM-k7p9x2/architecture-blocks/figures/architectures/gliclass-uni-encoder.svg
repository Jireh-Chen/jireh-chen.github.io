<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GLiClass uni-encoder architecture</title>
  <desc id="desc">Runtime label text and input text form one marked token sequence, pass through one shared encoder, and provide label and text representations to the MLP scorer configured by the collected base-v3.0 checkpoint.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#55627a"/></marker></defs>
  <style>.label{font:600 20px system-ui,sans-serif;fill:#17213b}.sub{font:14px system-ui,sans-serif;fill:#39445c}.flow{fill:none;stroke:#55627a;stroke-width:3;marker-end:url(#arrow)}</style>
  <g id="node-gliclass-uni-input"><rect x="55" y="235" width="275" height="190" rx="16" fill="#E5F5EC" stroke="#377C59" stroke-width="2"/><text class="label" x="192" y="295" text-anchor="middle">Joint label-text sequence</text><text class="sub" x="192" y="332" text-anchor="middle">runtime label descriptions</text><text class="sub" x="192" y="362" text-anchor="middle">class/text markers + input</text><text class="sub" x="192" y="392" text-anchor="middle">one attention mask</text></g>
  <g id="node-gliclass-uni-encoder"><rect x="410" y="210" width="290" height="240" rx="16" fill="#DCE8FF" stroke="#315EA8" stroke-width="2"/><text class="label" x="555" y="275" text-anchor="middle">Shared text-label encoder</text><text class="sub" x="555" y="315" text-anchor="middle">one joint encoder pass</text><text class="sub" x="555" y="350" text-anchor="middle">extract class-token states</text><text class="sub" x="555" y="380" text-anchor="middle">pool/project text features</text></g>
  <g id="node-gliclass-uni-scorer"><rect x="790" y="235" width="260" height="190" rx="16" fill="#FBE4E8" stroke="#A64255" stroke-width="2"/><text class="label" x="920" y="295" text-anchor="middle">Base-v3.0 MLP scorer</text><text class="sub" x="920" y="335" text-anchor="middle">text representation</text><text class="sub" x="920" y="365" text-anchor="middle">× per-label representations</text><text class="sub" x="920" y="395" text-anchor="middle">one logit per runtime label</text></g>
  <rect x="1090" y="275" width="80" height="110" rx="35" fill="#F7EACB" stroke="#8A6516" stroke-width="2"/><text class="label" x="1130" y="325" text-anchor="middle">Label</text><text class="sub" x="1130" y="352" text-anchor="middle">logits</text>
  <path class="flow" d="M330 330h75"/><path class="flow" d="M700 330h85"/><path class="flow" d="M1050 330h35"/>
  <text class="sub" x="600" y="585" text-anchor="middle">Checkpoint-specific redraw: scorer_type=mlp and pooling_strategy=first for knowledgator/gliclass-base-v3.0</text>
</svg>
