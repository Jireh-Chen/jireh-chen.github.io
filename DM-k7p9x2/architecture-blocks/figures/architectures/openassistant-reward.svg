<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc"><title id="title">OpenAssistant reward model</title><desc id="desc">A conversation and candidate response are jointly encoded and mapped to a scalar reward that is not a probability.</desc><rect width="960" height="280" fill="#f8fafc"/><g font-family="system-ui" text-anchor="middle"><g id="node-reward-conversation-input"><rect x="40" y="90" width="230" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text x="155" y="122">Conversation +</text><text x="155" y="147">candidate response</text></g><g id="node-reward-backbone"><rect x="365" y="90" width="230" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text x="480" y="130">Reward backbone</text></g><g id="node-reward-scalar-head"><rect x="690" y="90" width="220" height="90" rx="14" fill="#fee2e2" stroke="#dc2626"/><text x="800" y="122">Scalar reward</text><text x="800" y="147">not probability</text></g><path d="M270 135H365M595 135H690" stroke="#475569" stroke-width="3"/></g></svg>
