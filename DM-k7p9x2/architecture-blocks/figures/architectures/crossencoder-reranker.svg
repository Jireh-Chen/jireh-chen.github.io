<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc"><title id="title">Cross-encoder reranker</title><desc id="desc">An input and candidate are jointly encoded before scalar relevance scoring.</desc><rect width="960" height="280" fill="#f8fafc"/><g font-family="system-ui" text-anchor="middle"><g id="node-crossencoder-pair-input"><rect x="40" y="90" width="220" height="90" rx="14" fill="#dbeafe" stroke="#2563eb"/><text x="150" y="130">Input + candidate pair</text></g><g id="node-crossencoder-backbone"><rect x="350" y="90" width="250" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/><text x="475" y="130">Joint transformer pass</text></g><g id="node-crossencoder-score-head"><rect x="690" y="90" width="220" height="90" rx="14" fill="#ffedd5" stroke="#ea580c"/><text x="800" y="122">Scalar relevance</text><text x="800" y="147">per candidate</text></g><path d="M260 135H350M600 135H690" stroke="#475569" stroke-width="3"/></g></svg>
