<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AnyJev Tacit inference architecture</title>
  <desc id="desc">A typed decision prompt enters a self-distilled Tacit causal language model. A restricted label-token readout produces the normal one-forward decision; an optional margin-triggered route can generate bounded reasoning before rereading the labels.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#55627a"/></marker></defs>
  <style>.label{font:600 20px system-ui,sans-serif;fill:#17213b}.sub{font:14px system-ui,sans-serif;fill:#39445c}.flow{fill:none;stroke:#55627a;stroke-width:3;marker-end:url(#arrow)}.optional{fill:none;stroke:#8a6516;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}</style>
  <g id="node-tacit-prompt"><rect x="45" y="245" width="220" height="160" rx="16" fill="#E5F5EC" stroke="#377C59" stroke-width="2"/><text class="label" x="155" y="305" text-anchor="middle">Typed prompt</text><text class="sub" x="155" y="342" text-anchor="middle">state · question · options</text><text class="sub" x="155" y="370" text-anchor="middle">answer-label tokens</text></g>
  <g id="node-tacit-backbone"><rect x="330" y="245" width="225" height="160" rx="16" fill="#DCE8FF" stroke="#315EA8" stroke-width="2"/><text class="label" x="442" y="300" text-anchor="middle">Tacit causal LM</text><text class="sub" x="442" y="337" text-anchor="middle">self-distilled checkpoint</text><text class="sub" x="442" y="365" text-anchor="middle">one prefill</text></g>
  <g id="node-tacit-readout"><rect x="620" y="245" width="225" height="160" rx="16" fill="#FBE4E8" stroke="#A64255" stroke-width="2"/><text class="label" x="732" y="300" text-anchor="middle">Label-token readout</text><text class="sub" x="732" y="337" text-anchor="middle">valid labels only</text><text class="sub" x="732" y="365" text-anchor="middle">normalized decision scores</text></g>
  <g id="node-tacit-router"><rect x="910" y="210" width="245" height="230" rx="16" fill="#ECEEF2" stroke="#626B7A" stroke-width="2" stroke-dasharray="10 7"/><text class="label" x="1032" y="275" text-anchor="middle">Adaptive router</text><text class="sub" x="1032" y="312" text-anchor="middle">top-two margin threshold</text><text class="sub" x="1032" y="342" text-anchor="middle">rolling escalation cap</text><text class="sub" x="1032" y="390" text-anchor="middle">optional bounded reasoning</text></g>
  <path class="flow" d="M265 325h60"/><path class="flow" d="M555 325h60"/><path class="flow" d="M845 325h60"/>
  <path class="optional" d="M1005 205C930 80 470 82 446 238"/><text class="sub" x="735" y="82" text-anchor="middle">optional: generate reasoning, then reread the answer-label distribution</text>
  <text class="sub" x="600" y="595" text-anchor="middle">Self-distillation is a training provenance claim; the diagram depicts the verified inference path</text>
</svg>
