<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d"><title id="t">ModernBERT linear classifier internals</title><desc id="d">A hidden-size pooled vector is multiplied by a learned weight matrix and bias to produce fixed task logits.</desc><style>.x{font:600 17px system-ui;fill:#17213b}.s{font:14px system-ui;fill:#39445c}</style><rect x="45" y="125" width="190" height="110" rx="12" fill="#E5F5EC" stroke="#377C59"/><text class="x" x="140" y="172" text-anchor="middle">Pooled vector</text><text class="s" x="140" y="202" text-anchor="middle">B × hidden_size</text><rect x="315" y="110" width="205" height="140" rx="12" fill="#FBE4E8" stroke="#A64255"/><text class="x" x="417" y="164" text-anchor="middle">Learned W, b</text><text class="s" x="417" y="194" text-anchor="middle">hidden_size → labels</text><rect x="600" y="125" width="155" height="110" rx="12" fill="#F7EACB" stroke="#8A6516"/><text class="x" x="677" y="172" text-anchor="middle">Task logits</text><text class="s" x="677" y="202" text-anchor="middle">B × num_labels</text><path d="M235 180h75M520 180h75" stroke="#55627a" stroke-width="3"/></svg>
