<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">CLIP zero-shot classification</title><desc id="d">Separate image and text prompt encoders meet at normalized cosine similarity, then softmax normalizes candidate scores.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#55627a"/></marker></defs><style>.x{font:600 18px system-ui;fill:#17213b}.s{font:14px system-ui;fill:#39445c}.l{stroke:#55627a;stroke-width:3;fill:none;marker-end:url(#a)}</style><g id="node-clip-vision-encoder"><rect x="60" y="110" width="180" height="100" rx="14" fill="#E5F5EC" stroke="#377C59"/><text class="x" x="150" y="168" text-anchor="middle">Image</text><rect x="335" y="90" width="250" height="140" rx="14" fill="#DCE8FF" stroke="#315EA8"/><text class="x" x="460" y="152" text-anchor="middle">ViT-B/32</text><text class="s" x="460" y="182" text-anchor="middle">image embedding</text></g><g id="node-clip-text-encoder"><rect x="60" y="465" width="180" height="100" rx="14" fill="#E5F5EC" stroke="#377C59"/><text class="x" x="150" y="505" text-anchor="middle">Class prompts</text><text class="s" x="150" y="535" text-anchor="middle">runtime candidates</text><rect x="335" y="445" width="250" height="140" rx="14" fill="#DCE8FF" stroke="#315EA8"/><text class="x" x="460" y="507" text-anchor="middle">Text Transformer</text><text class="s" x="460" y="537" text-anchor="middle">prompt embeddings</text></g><g id="node-clip-cosine-scorer"><rect x="710" y="255" width="230" height="165" rx="14" fill="#FBE4E8" stroke="#A64255"/><text class="x" x="825" y="315" text-anchor="middle">Normalize + cosine</text><text class="s" x="825" y="345" text-anchor="middle">learned logit scale</text><text class="s" x="825" y="375" text-anchor="middle">image × prompts</text></g><g id="node-clip-class-softmax"><rect x="1025" y="270" width="130" height="135" rx="14" fill="#F7EACB" stroke="#8A6516"/><text class="x" x="1090" y="330" text-anchor="middle">Class</text><text class="x" x="1090" y="358" text-anchor="middle">softmax</text></g><path class="l" d="M240 160h90"/><path class="l" d="M240 515h90"/><path class="l" d="M585 160c75 0 65 120 120 145"/><path class="l" d="M585 515c75 0 65-120 120-145"/><path class="l" d="M940 337h80"/></svg>
