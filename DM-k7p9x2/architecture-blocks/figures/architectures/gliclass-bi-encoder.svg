<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">GLiClass bi-encoder</title><desc id="d">Text and runtime labels are independently encoded and then compared by a candidate scorer.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#55627a"/></marker></defs><style>.x{font:600 19px system-ui;fill:#17213b}.s{font:14px system-ui;fill:#39445c}.l{stroke:#55627a;stroke-width:3;fill:none;marker-end:url(#a)}</style><rect x="65" y="120" width="180" height="100" rx="14" fill="#E5F5EC" stroke="#377C59"/><text class="x" x="155" y="178" text-anchor="middle">Input text</text><rect x="65" y="455" width="180" height="100" rx="14" fill="#E5F5EC" stroke="#377C59"/><text class="x" x="155" y="500" text-anchor="middle">Runtime labels</text><text class="s" x="155" y="528" text-anchor="middle">variable count</text><rect x="350" y="100" width="245" height="140" rx="14" fill="#DCE8FF" stroke="#315EA8"/><text class="x" x="472" y="160" text-anchor="middle">Text encoder</text><text class="s" x="472" y="190" text-anchor="middle">pool + project</text><rect x="350" y="435" width="245" height="140" rx="14" fill="#DCE8FF" stroke="#315EA8"/><text class="x" x="472" y="495" text-anchor="middle">Label encoder</text><text class="s" x="472" y="525" text-anchor="middle">one vector per label</text><rect x="720" y="255" width="240" height="165" rx="14" fill="#FBE4E8" stroke="#A64255"/><text class="x" x="840" y="325" text-anchor="middle">Candidate scorer</text><text class="s" x="840" y="355" text-anchor="middle">dot + learned scale</text><rect x="1030" y="270" width="120" height="135" rx="14" fill="#F7EACB" stroke="#8A6516"/><text class="x" x="1090" y="330" text-anchor="middle">Label</text><text class="x" x="1090" y="358" text-anchor="middle">logits</text><path class="l" d="M245 170h100"/><path class="l" d="M245 505h100"/><path class="l" d="M595 170c80 0 55 120 120 145"/><path class="l" d="M595 505c80 0 55-120 120-145"/><path class="l" d="M960 337h65"/></svg>
