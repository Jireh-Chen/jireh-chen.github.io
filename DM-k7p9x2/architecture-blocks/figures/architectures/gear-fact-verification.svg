<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">GEAR fact verification</title><desc id="d">Claim-evidence encoding, evidence graph reasoning, aggregation classifier.</desc><style>.bg{fill:var(--diagram-bg,#fff)}.n{stroke:var(--diagram-edge,#47647f);stroke-width:2}.i{fill:var(--diagram-input,#e5f5ec)}.a{fill:var(--diagram-processing,#e9e1f8)}.h{fill:var(--diagram-decision,#fbe4e8)}.x{fill:var(--diagram-text,#1b2b43);font:600 18px system-ui;text-anchor:middle}.e{stroke:var(--diagram-edge,#47647f);stroke-width:3}</style><rect class="bg" width="960" height="300"/><g id="node-encoder"><rect class="n i" x="30" y="88" width="260" height="124" rx="14"/><text class="x" x="160" y="145">Claim + evidence pairs</text><text class="x" x="160" y="173">BERT node states</text></g><path class="e" d="M290 150H365"/><g id="node-graph"><rect class="n a" x="365" y="88" width="260" height="124" rx="14"/><text class="x" x="495" y="145">Fully connected</text><text class="x" x="495" y="173">evidence graph</text></g><path class="e" d="M625 150H700"/><g id="node-head"><rect class="n h" x="700" y="88" width="230" height="124" rx="14"/><text class="x" x="815" y="145">Aggregation</text><text class="x" x="815" y="173">3-way decision</text></g></svg>
