<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">SigLIP zero-shot scoring</title><desc id="d">Vision and text towers produce pairwise sigmoid scores.</desc><style>.bg{fill:var(--diagram-bg,#fff)}.n{stroke:var(--diagram-edge,#47647f);stroke-width:2}.a{fill:var(--diagram-representation,#dfeaff)}.c{fill:var(--diagram-decision,#dff5ef)}.tx{fill:var(--diagram-text,#1b2b43);font:600 18px system-ui;text-anchor:middle}.e{stroke:var(--diagram-edge,#47647f);stroke-width:3}</style><rect class="bg" width="960" height="360"/><g id="node-vision"><rect class="n a" x="30" y="35" width="260" height="105" rx="14"/><text class="tx" x="160" y="94">Vision tower</text></g><g id="node-text"><rect class="n a" x="30" y="220" width="260" height="105" rx="14"/><text class="tx" x="160" y="279">Text tower</text></g><path class="e" d="M290 88L585 160M290 273L585 200"/><g id="node-head"><rect class="n c" x="585" y="105" width="345" height="150" rx="14"/><text class="tx" x="757" y="170">scaled similarity + bias</text><text class="tx" x="757" y="199">independent sigmoid score</text></g></svg>
