<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">ModernBERT sequence classifier</title><desc id="d">Tokenized text passes through ModernBERT, configurable pooling, and a fixed-width linear classifier.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#55627a"/></marker></defs><style>.x{font:600 18px system-ui;fill:#17213b}.s{font:14px system-ui;fill:#39445c}.l{stroke:#55627a;stroke-width:3;marker-end:url(#a)}</style><rect x="50" y="190" width="190" height="120" rx="14" fill="#E5F5EC" stroke="#377C59"/><text class="x" x="145" y="242" text-anchor="middle">Tokenized text</text><text class="s" x="145" y="272" text-anchor="middle">attention mask</text><rect x="320" y="170" width="240" height="160" rx="14" fill="#DCE8FF" stroke="#315EA8"/><text class="x" x="440" y="235" text-anchor="middle">ModernBERT</text><text class="s" x="440" y="265" text-anchor="middle">bidirectional encoder</text><rect x="640" y="170" width="210" height="160" rx="14" fill="#FBE4E8" stroke="#A64255"/><text class="x" x="745" y="225" text-anchor="middle">Pooling head</text><text class="s" x="745" y="255" text-anchor="middle">CLS / mean / max</text><text class="s" x="745" y="280" text-anchor="middle">dense · act · norm</text><rect x="930" y="170" width="220" height="160" rx="14" fill="#FBE4E8" stroke="#A64255"/><text class="x" x="1040" y="225" text-anchor="middle">Linear classifier</text><text class="s" x="1040" y="255" text-anchor="middle">hidden → num_labels</text><text class="s" x="1040" y="280" text-anchor="middle">fixed output width</text><line class="l" x1="240" y1="250" x2="315" y2="250"/><line class="l" x1="560" y1="250" x2="635" y2="250"/><line class="l" x1="850" y1="250" x2="925" y2="250"/></svg>
