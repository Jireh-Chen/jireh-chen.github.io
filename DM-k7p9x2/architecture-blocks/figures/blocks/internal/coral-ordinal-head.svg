<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d"><title id="t">CORAL ordinal head internals</title><desc id="d">Shared feature projection and ordered threshold biases yield cumulative logits.</desc><style>.b{fill:var(--diagram-bg,#fff)}.n{stroke:var(--diagram-edge,#47647f);stroke-width:2}.i{fill:var(--diagram-input,#e5f5ec)}.h{fill:var(--diagram-decision,#fbe4e8)}.o{fill:var(--diagram-output,#f7eacb)}.x{fill:var(--diagram-text,#1b2b43);font:600 15px system-ui;text-anchor:middle}.e{stroke:var(--diagram-edge,#47647f);stroke-width:3}</style><rect class="b" width="800" height="360"/><rect class="n i" x="30" y="120" width="150" height="120" rx="12"/><text class="x" x="105" y="175">Feature x</text><text class="x" x="105" y="200">H dimensions</text><path class="e" d="M180 180H250"/><rect class="n h" x="250" y="120" width="160" height="120" rx="12"/><text class="x" x="330" y="175">Shared scalar</text><text class="x" x="330" y="200">s = wᵀx</text><path class="e" d="M410 180H475"/><rect class="n h" x="475" y="55" width="160" height="250" rx="12"/><text class="x" x="555" y="105">s + b₁</text><text class="x" x="555" y="150">s + b₂</text><text class="x" x="555" y="195">…</text><text class="x" x="555" y="240">s + bK−1</text><text class="x" x="555" y="276">ordered biases</text><path class="e" d="M635 180H680"/><rect class="n o" x="680" y="105" width="95" height="150" rx="12"/><text class="x" x="727" y="165">K−1</text><text class="x" x="727" y="190">cumulative</text><text class="x" x="727" y="215">logits</text></svg>
