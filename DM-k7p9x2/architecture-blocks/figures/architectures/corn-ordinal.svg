<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">CORN ordinal classifier</title><desc id="d">Task backbone, conditional rank logits, chained ordinal decoder.</desc><style>.bg{fill:var(--diagram-bg,#fff)}.n{stroke:var(--diagram-edge,#47647f);stroke-width:2}.b{fill:var(--diagram-backbone,#dce8ff)}.h{fill:var(--diagram-decision,#fbe4e8)}.o{fill:var(--diagram-output,#f7eacb)}.x{fill:var(--diagram-text,#1b2b43);font:600 18px system-ui;text-anchor:middle}.e{stroke:var(--diagram-edge,#47647f);stroke-width:3}</style><rect class="bg" width="960" height="300"/><g id="node-backbone"><rect class="n b" x="30" y="88" width="260" height="124" rx="14"/><text class="x" x="160" y="155">Task feature backbone</text></g><path class="e" d="M290 150H365"/><g id="node-head"><rect class="n h" x="365" y="88" width="260" height="124" rx="14"/><text class="x" x="495" y="145">Conditional logits</text><text class="x" x="495" y="173">P(y&gt;k | y&gt;k−1)</text></g><path class="e" d="M625 150H700"/><g id="node-decoder"><rect class="n o" x="700" y="88" width="230" height="124" rx="14"/><text class="x" x="815" y="145">Probability chain</text><text class="x" x="815" y="173">ordinal label</text></g></svg>
