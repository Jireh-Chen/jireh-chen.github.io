<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d"><title id="t">CLIP similarity scorer internals</title><desc id="d">Image and text embeddings are L2 normalized, multiplied, and scaled by exp of a learned scalar.</desc><style>.x{font:600 16px system-ui;fill:#17213b}.s{font:14px system-ui;fill:#39445c}</style><rect x="35" y="55" width="150" height="75" rx="12" fill="#DCE8FF" stroke="#315EA8"/><text class="x" x="110" y="99" text-anchor="middle">Image vectors</text><rect x="35" y="230" width="150" height="75" rx="12" fill="#DCE8FF" stroke="#315EA8"/><text class="x" x="110" y="274" text-anchor="middle">Text vectors</text><rect x="250" y="55" width="135" height="75" rx="12" fill="#FBE4E8" stroke="#A64255"/><text class="x" x="317" y="99" text-anchor="middle">L2 normalize</text><rect x="250" y="230" width="135" height="75" rx="12" fill="#FBE4E8" stroke="#A64255"/><text class="x" x="317" y="274" text-anchor="middle">L2 normalize</text><rect x="465" y="125" width="140" height="110" rx="12" fill="#FBE4E8" stroke="#A64255"/><text class="x" x="535" y="170" text-anchor="middle">Matrix product</text><text class="s" x="535" y="198" text-anchor="middle">× exp(logit_scale)</text><rect x="670" y="135" width="100" height="90" rx="12" fill="#F7EACB" stroke="#8A6516"/><text class="x" x="720" y="175" text-anchor="middle">Image ×</text><text class="x" x="720" y="198" text-anchor="middle">text logits</text><path d="M185 92h60M185 267h60M385 92c45 0 35 50 75 72M385 267c45 0 35-50 75-72M605 180h60" fill="none" stroke="#55627a" stroke-width="3"/></svg>
