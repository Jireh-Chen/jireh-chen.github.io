<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d"><title id="t">GLiClass dot scorer internals</title><desc id="d">A B by D text matrix and B by C by D label tensor produce B by C scores and a learned scaling.</desc><style>.x{font:600 17px system-ui;fill:#17213b}.s{font:14px system-ui;fill:#39445c}</style><rect x="40" y="70" width="180" height="90" rx="12" fill="#E5F5EC" stroke="#377C59"/><text class="x" x="130" y="112" text-anchor="middle">Text vectors</text><text class="s" x="130" y="137" text-anchor="middle">B × D</text><rect x="40" y="210" width="180" height="90" rx="12" fill="#DCE8FF" stroke="#315EA8"/><text class="x" x="130" y="252" text-anchor="middle">Label vectors</text><text class="s" x="130" y="277" text-anchor="middle">B × C × D</text><rect x="315" y="125" width="190" height="110" rx="12" fill="#FBE4E8" stroke="#A64255"/><text class="x" x="410" y="172" text-anchor="middle">einsum BD,BCD</text><text class="s" x="410" y="200" text-anchor="middle">one dot per label</text><rect x="585" y="125" width="175" height="110" rx="12" fill="#F7EACB" stroke="#8A6516"/><text class="x" x="672" y="170" text-anchor="middle">Scaled logits</text><text class="s" x="672" y="198" text-anchor="middle">B × C</text><path d="M220 115c45 0 50 30 90 45M220 255c45 0 50-30 90-45M505 180h75" fill="none" stroke="#55627a" stroke-width="3"/></svg>
