<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AnyJev L0 training-free decision architecture</title>
  <desc id="desc">A typed state-question-options prompt enters an unchanged causal language model. Valid answer-label token scores are read, cyclic option rotations are combined, and an optional unlabeled prior correction precedes normalized option probabilities.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#55627a"/></marker></defs>
  <style>.label{font:600 20px system-ui,sans-serif;fill:#17213b}.sub{font:14px system-ui,sans-serif;fill:#39445c}.flow{fill:none;stroke:#55627a;stroke-width:3;marker-end:url(#arrow)}.repeat{fill:none;stroke:#8a6516;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}</style>
  <g id="node-anyjev-prompt"><rect x="45" y="245" width="230" height="170" rx="16" fill="#E5F5EC" stroke="#377C59" stroke-width="2"/><text class="label" x="160" y="305" text-anchor="middle">Typed decision prompt</text><text class="sub" x="160" y="340" text-anchor="middle">state · question · options</text><text class="sub" x="160" y="370" text-anchor="middle">answer-label tokens</text></g>
  <g id="node-anyjev-backbone"><rect x="340" y="245" width="220" height="170" rx="16" fill="#DCE8FF" stroke="#315EA8" stroke-width="2"/><text class="label" x="450" y="305" text-anchor="middle">Open causal LM</text><text class="sub" x="450" y="340" text-anchor="middle">unchanged weights</text><text class="sub" x="450" y="370" text-anchor="middle">prompt prefill</text></g>
  <g id="node-anyjev-readout"><rect x="625" y="245" width="220" height="170" rx="16" fill="#FBE4E8" stroke="#A64255" stroke-width="2"/><text class="label" x="735" y="305" text-anchor="middle">Label-token readout</text><text class="sub" x="735" y="340" text-anchor="middle">restrict next-token scores</text><text class="sub" x="735" y="370" text-anchor="middle">to valid option labels</text></g>
  <g id="node-anyjev-l0"><rect x="910" y="225" width="245" height="210" rx="16" fill="#F7EACB" stroke="#8A6516" stroke-width="2"/><text class="label" x="1032" y="290" text-anchor="middle">L0 correction</text><text class="sub" x="1032" y="325" text-anchor="middle">cyclic-shift marginalization</text><text class="sub" x="1032" y="355" text-anchor="middle">optional unlabeled prior</text><text class="sub" x="1032" y="395" text-anchor="middle">normalized option probabilities</text></g>
  <path class="flow" d="M275 330h60"/><path class="flow" d="M560 330h60"/><path class="flow" d="M845 330h60"/>
  <path class="repeat" d="M1000 220C900 85 165 85 150 238"/><text class="sub" x="590" y="88" text-anchor="middle">repeat over cyclic option rotations; early stop only under the documented rule</text>
  <text class="sub" x="600" y="605" text-anchor="middle">Training-free inference path · optional prior correction is not probability calibration</text>
</svg>
