<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d"><title id="t">SetRank interaction internals</title><desc id="d">Candidate vectors jointly enter multi-head set attention and produce contextual candidates.</desc><style>.b{fill:var(--diagram-bg,#fff)}.n{stroke:var(--diagram-edge,#47647f);stroke-width:2}.i{fill:var(--diagram-input,#e5f5ec)}.a{fill:var(--diagram-processing,#e9e1f8)}.x{fill:var(--diagram-text,#1b2b43);font:600 15px system-ui;text-anchor:middle}.e{stroke:var(--diagram-edge,#47647f);stroke-width:3}</style><rect class="b" width="800" height="360"/><rect class="n i" x="30" y="80" width="185" height="200" rx="12"/><text class="x" x="122" y="145">Candidate matrix</text><text class="x" x="122" y="175">d₁ … dₙ</text><text class="x" x="122" y="205">no rank positions</text><path class="e" d="M215 180H285"/><rect class="n a" x="285" y="60" width="230" height="240" rx="12"/><text class="x" x="400" y="130">Multi-head self-attention</text><text class="x" x="400" y="165">all candidates interact</text><text class="x" x="400" y="200">residual + feed-forward</text><text class="x" x="400" y="235">stacked or induced blocks</text><path class="e" d="M515 180H585"/><rect class="n a" x="585" y="80" width="185" height="200" rx="12"/><text class="x" x="677" y="145">Contextual matrix</text><text class="x" x="677" y="175">z₁ … zₙ</text><text class="x" x="677" y="205">permutation equivariant</text></svg>
