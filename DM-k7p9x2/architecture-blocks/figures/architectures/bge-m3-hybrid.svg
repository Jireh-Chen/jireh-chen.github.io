<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">BGE-M3 Dense, sparse, and multi-vector scoring</title><desc id="desc">Simplified source-grounded Decision Blocks redraw showing the documented decision path.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--db-edge,#66768B)"/></marker></defs><rect width="1200" height="675" fill="var(--db-diagram-bg,#FFFFFF)"/><text x="40" y="64" font-size="30" font-weight="700" fill="var(--db-diagram-text,#1B2B43)">BGE-M3 · Dense, sparse, and multi-vector scoring</text><text x="40" y="98" font-size="16" fill="var(--db-diagram-muted,#66768B)">Source-grounded conceptual redraw · decision-relevant computation only</text><g fill="var(--db-diagram-text,#1B2B43)" font-family="Inter, Noto Sans SC, sans-serif"><g id="node-input" class="node"><rect x="40" y="230" width="210" height="180" rx="18" fill="#E5F5EC" stroke="#377C59" stroke-width="4"/><text x="145" y="295" text-anchor="middle" font-size="24" font-weight="700">BGE-M3 query/document input</text><text x="145" y="337" text-anchor="middle" font-size="17">input-encoding</text><text x="145" y="375" text-anchor="middle" font-size="15">token sequences</text></g><g id="node-encoder" class="node"><rect x="320" y="230" width="210" height="180" rx="18" fill="#DCE8FF" stroke="#315EA8" stroke-width="4"/><text x="425" y="295" text-anchor="middle" font-size="24" font-weight="700">BGE-M3 shared encoder</text><text x="425" y="337" text-anchor="middle" font-size="17">backbone</text><text x="425" y="375" text-anchor="middle" font-size="15">shared contextual states</text></g><g id="node-heads" class="node"><rect x="600" y="230" width="210" height="180" rx="18" fill="#E9E1F8" stroke="#68449A" stroke-width="4"/><text x="705" y="295" text-anchor="middle" font-size="24" font-weight="700">BGE-M3 retrieval heads</text><text x="705" y="337" text-anchor="middle" font-size="17">decision-head</text><text x="705" y="375" text-anchor="middle" font-size="15">dense, sparse, and multi-vector scores</text></g><g id="node-fusion" class="node"><rect x="880" y="230" width="210" height="180" rx="18" fill="#F7EACB" stroke="#8A6516" stroke-width="4"/><text x="985" y="295" text-anchor="middle" font-size="24" font-weight="700">BGE-M3 score combination</text><text x="985" y="337" text-anchor="middle" font-size="17">output-processing</text><text x="985" y="375" text-anchor="middle" font-size="15">combined candidate score</text></g><path d="M 258 320 L 312 320" stroke="var(--db-edge,#66768B)" stroke-width="4" marker-end="url(#arrow)"/><path d="M 538 320 L 592 320" stroke="var(--db-edge,#66768B)" stroke-width="4" marker-end="url(#arrow)"/><path d="M 818 320 L 872 320" stroke="var(--db-edge,#66768B)" stroke-width="4" marker-end="url(#arrow)"/></g><text x="40" y="625" font-size="15" fill="var(--db-diagram-muted,#66768B)">Grounding: cited primary paper · verification: author-reported · no calibration implied</text></svg>
